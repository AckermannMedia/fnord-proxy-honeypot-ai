# Production overrides — use with:
#   DOMAIN=example.com BACKEND_URL=http://10.0.0.5:80 \
#     docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d

services:
  nginx:
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/fnord-proxy.conf.template:/etc/nginx/templates/default.conf.template:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    environment:
      - DOMAIN=${DOMAIN:?Set DOMAIN environment variable}
      - BACKEND_URL=${BACKEND_URL:-http://dashboard:8888}

  dashboard:
    environment:
      - FNORD_HONEYPOT_LOG=/var/log/nginx/honeypot.log
      - FNORD_BIND_HOST=0.0.0.0
      - FNORD_BIND_PORT=8888

  fail2ban:
    image: lscr.io/linuxserver/fail2ban:latest
    network_mode: host
    cap_add:
      - NET_ADMIN
      - NET_RAW
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=UTC
      - IPTABLES_MODE=legacy
    volumes:
      - nginx-logs:/var/log/nginx:ro
      - ./fail2ban/fnord-honeypot.conf:/config/fail2ban/filter.d/fnord-honeypot.conf:ro
      - ./fail2ban/jail-fnord.conf:/config/fail2ban/jail.d/fnord-honeypot.conf:ro
    restart: unless-stopped
